<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATLAS v10 更新修復</title><style>body{font-family:system-ui,sans-serif;background:#f5f6fc;color:#27304a;padding:35px 20px;line-height:1.8}main{max-width:620px;margin:30px auto;background:white;padding:30px;border-radius:20px;border:1px solid #e2e6f0}button,a{display:inline-block;background:#5b50d9;color:white;padding:12px 18px;border:0;border-radius:9px;text-decoration:none;font-size:16px}code{word-break:break-all}small{color:#637088}</style></head><body><main><h1>新版產業地圖 v10</h1><p>這個入口只更新網站程式快取，<b>不刪除交易、收藏、筆記或 Token 設定</b>。</p><p>部署完成後，按下方按鈕重新開啟。之前 v7 的雷達頁面與新工作台使用不同程式檔及 API 路徑。</p><button id="repair">更新程式並開啟</button><p id="result"></p><p><small>首次需有網路。不是把價格改成示範資料；行情仍須正式後端回應。</small></p><a href="./index.html?version=10#focus">直接開啟新首頁</a></main><script>
document.getElementById('repair').onclick=async function(){this.disabled=true;const el=document.getElementById('result');el.textContent='正在更新網站程式…';try{
if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>new URL(r.scope).origin===location.origin).map(r=>r.unregister()));}
if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('atlas-shell-')||k.startsWith('atlas-map-v')).map(k=>caches.delete(k)));}
location.replace('./index.html?v10='+Date.now()+'#focus');}catch(e){el.textContent='更新遇到問題：'+e.message;this.disabled=false;}};
</script></body></html>
