[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Explicitly route the public /api/* paths used by the frontend
# to the matching Netlify Function. Query strings are preserved.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true
